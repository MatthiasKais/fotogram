<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>

    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/standard.css" />
    <link rel="stylesheet" href="styles/font.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles/responisve.css" />
    <link rel="icon" type="image/x-icon" href="./img/favicon.png" />
  </head>

  <body onload="render()">
    <header>
      <div>
        <div class="header-content">
          <img src="img/icon_fotogram.png" alt="Fotogram Logo" />
          <img src="img/text_fotogram.png" alt="Fotogram" />
        </div>
      </div>
    </header>

    <main>
      <article class="article-header-imgs">
        <h1 class="article-header">Your personal photo album</h1>
        <section class="section-imgs">
          <div id="content" class="container-imgs"></div>
        </section>
      </article>

      <dialog class="dialog-style" id="openImg">
        <header class="header-dialog-img">
          <p id="dialogImgName"></p>

          <input type="image" src="./img/x.svg" alt="Close Dialog" class="dialog-button" onclick="closeDialog()" > 
        </header>

        <section>
          <div id="dialogContent"></div>
        </section>

        <footer>
          <button
            class="dialog-button"
            onclick="filterButton(currentIndex, 'left')"
             tabindex="0"
          >
            <img
              src="./img/Button_left.svg"
              alt="Previous image"
             
            />
          </button>
          <p id="imgNumberOf"></p>
          <button
            class="dialog-button"
            onclick="filterButton(currentIndex, 'right')"
            tabindex="0"
          >
            <img src="./img/Button_right.svg" alt="Next Image" />
          </button>
        </footer>
      </dialog>
    </main>

    <footer>
      <div class="footer-content">
        <div>
          <img
            class="footer-images"
            src="img/icon_da.png"
            alt="Developer Acedemy Logo"
          />
          <img
            class="footer-images"
            src="img/text_icon_da.png"
            alt="Developer Acedemy"
          />
        </div>
        <p class="footer-text">&copy 2023 Developer Akademie GmbH</p>
      </div>
    </footer>
    <script src="./js/script.js"></script>
  </body>
</html>
