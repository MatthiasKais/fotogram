<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotogram</title>

  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/standard.css" />
  <link rel="stylesheet" href="styles/font.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles/responisve.css" />
  <link rel="icon" type="image/x-icon" href="./img/favicon.png">
</head>

<body onload="render()">
  <header>
    <div>
      <div class="header-content">
        <img src="img/icon_fotogram.png" alt="Fotogram Logo" />
        <img src="img/text_fotogram.png" alt="Fotogram" />
      </div>
    </div>
  </header>

  <main>
    <article class="article-header-imgs">
      <header class="article-header" >
        <h1>Your personal photo album</h1>
      </header>

      <section class="section-imgs">
        <div id="content" class="container-imgs"></div>
      </section>
    </article>

    <dialog class="dialog-style" id="openImg">

      <header class="header-dialog-img">
        <p id="dialogImgName" ></p>
        <img src="./img/x.svg" onclick="closeDialog()" alt="Close Dialog" tabindex="0">
      </header>

      <section>
        <div id="dialogContent"></div>
      </section>

      <footer>
        <img onclick="filterButtonLeft(currentIndex)" src="./img/Button_left.svg" alt="Previous image" tabindex="0">
        <p id="imgNumberOf"> </p>
        <img onclick="filterButtonRight(currentIndex)" src="./img/Button_right.svg" alt="Next Image" tabindex="0">
      </footer>


    </dialog>
  </main>

  <footer>
    <div class="footer-content">
      <div>
        <img  class="footer-images" src="img/icon_da.png" alt="Developer Acedemy Logo" />
        <img class="footer-images" src="img/text_icon_da.png" alt="Developer Acedemy" />
      </div>
      <p class="footer-text">&copy 2023 Developer Akademie GmbH</p>
    </div>
  </footer>
  <script src="./js/script.js"></script>
</body>

</html>
